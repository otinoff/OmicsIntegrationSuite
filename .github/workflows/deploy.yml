name: Deploy to Server

on:
  # ❌ ОТКЛЮЧЕН автоматический деплой (вызывал 502 при каждом push)
  # push:
  #   branches:
  #     - main
  #     - master

  # ✅ Только ручной запуск через GitHub Actions UI
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
    
    - name: Deploy to server via SSH
      uses: appleboy/ssh-action@v1.0.0
      with:
        host: 5.35.88.251
        username: root
        key: ${{ secrets.SERVER_SSH_KEY }}
        port: 22
        script: |
          # Создаем директорию если её нет
          mkdir -p /var/OmicsIntegrationSuite
          
          # Переходим в директорию
          cd /var/OmicsIntegrationSuite
          
          # Если это первый деплой - клонируем репозиторий
          if [ ! -d ".git" ]; then
            git clone https://github.com/otinoff/OmicsIntegrationSuite.git .
          else
            # Иначе - обновляем существующий репозиторий
            git fetch origin
            git reset --hard origin/main || git reset --hard origin/master
          fi
          
          # Устанавливаем зависимости Python (если есть requirements.txt)
          if [ -f "requirements.txt" ]; then
            pip3 install -r requirements.txt
          fi
          
          # Делаем скрипты исполняемыми
          chmod +x *.sh 2>/dev/null || true
          
          # Запускаем Streamlit веб-интерфейс
          ./start_streamlit.sh
          
          # Настраиваем Nginx для проксирования (если нужно)
          # Streamlit будет доступен на порту 8501
          
          echo "Deployment completed successfully!"
          echo "Web interface available at: http://omicsintegrationsuite.onff.ru/"
    
    - name: FORCE DETAILED DIAGNOSTICS
      uses: appleboy/ssh-action@v1.0.0
      with:
        host: 5.35.88.251
        username: root
        key: ${{ secrets.SERVER_SSH_KEY }}
        port: 22
        script: |
          cd /var/OmicsIntegrationSuite

          echo "=========================================="
          echo "🔍 FORCED DIAGNOSTICS OUTPUT"
          echo "=========================================="
          echo ""

          echo "1️⃣ Python Version:"
          python3 --version
          echo ""

          echo "2️⃣ Streamlit Installation:"
          python3 -c "import streamlit; print(f'Streamlit {streamlit.__version__}')" || echo "❌ STREAMLIT NOT INSTALLED!"
          echo ""

          echo "3️⃣ Current Streamlit Processes:"
          ps aux | grep streamlit | grep -v grep || echo "❌ NO STREAMLIT PROCESS RUNNING!"
          echo ""

          echo "4️⃣ Port 8520 Status:"
          ss -tulpn | grep 8520 || echo "❌ PORT 8520 NOT LISTENING!"
          echo ""

          echo "5️⃣ Last 50 Lines of streamlit.log:"
          if [ -f "streamlit.log" ]; then
            tail -50 streamlit.log
          else
            echo "❌ streamlit.log NOT FOUND!"
          fi
          echo ""

          echo "6️⃣ Test Local Connection:"
          curl -s -o /dev/null -w "HTTP Status: %{http_code}\n" http://localhost:8520 || echo "❌ CURL FAILED!"
          echo ""

          echo "7️⃣ Git Status:"
          git log --oneline -3
          git status --short
          echo ""

          echo "8️⃣ Files Present:"
          ls -lah web_interface*.py start_streamlit.sh 2>/dev/null || echo "Files missing!"
          echo ""

          echo "=========================================="
          echo "END DIAGNOSTICS"
          echo "=========================================="

          # Save diagnostics to file
          echo "💾 Saving diagnostics to DIAGNOSTICS_OUTPUT.txt..."
          {
            echo "=========================================="
            echo "🔍 SERVER DIAGNOSTICS - $(date)"
            echo "=========================================="
            echo ""
            echo "1️⃣ Python Version:"
            python3 --version
            echo ""
            echo "2️⃣ Streamlit Installation:"
            python3 -c "import streamlit; print(f'Streamlit {streamlit.__version__}')" 2>&1 || echo "❌ ERROR!"
            echo ""
            echo "3️⃣ Current Streamlit Processes:"
            ps aux | grep streamlit | grep -v grep || echo "❌ NO PROCESS!"
            echo ""
            echo "4️⃣ Port 8520 Status:"
            ss -tulpn | grep 8520 || echo "❌ NOT LISTENING!"
            echo ""
            echo "5️⃣ Last 100 Lines of streamlit.log:"
            tail -100 streamlit.log 2>&1 || echo "❌ LOG NOT FOUND!"
            echo ""
            echo "6️⃣ HTTP Test:"
            curl -s -o /dev/null -w "HTTP: %{http_code}\n" http://localhost:8520 2>&1
            echo ""
            echo "7️⃣ Git:"
            git log --oneline -3
            echo ""
            echo "8️⃣ Files:"
            ls -lah web_interface*.py start_streamlit.sh
          } > DIAGNOSTICS_OUTPUT.txt

          # ❌ НЕ коммитим диагностику обратно (вызывало бесконечный цикл!)
          # git config user.name "GitHub Actions"
          # git config user.email "actions@github.com"
          # git add DIAGNOSTICS_OUTPUT.txt
          # git commit -m "diagnostics: server output $(date +%Y-%m-%d-%H-%M)" || echo "No changes to commit"
          # git push origin main || echo "Push failed (expected)"

          echo "✅ Diagnostics saved to DIAGNOSTICS_OUTPUT.txt (local only)"